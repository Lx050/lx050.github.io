<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>庭中阅览 · 独立验证</title><link rel="stylesheet" href="../../assets/reading-room.css">
<style>body{margin:0;min-height:100vh;background:linear-gradient(30deg,#233733,#84916f);color:#eee9da;font:15px/1.7 sans-serif}main{padding:30px;max-width:980px;margin:auto}button{padding:13px 20px;cursor:pointer}#results{white-space:pre-wrap}#status{font-weight:700}</style>
<main><h1>庭中阅览 · 验证页面</h1><p>此页只使用本地测试文字。所有加载由页面内的固定资料模拟，不访问原站。</p><button id="run">运行行为检查</button> <button id="opener">打开示例阅览</button><p id="status">尚未运行</p><pre id="results"></pre></main>
<script src="../../assets/reading-room.js"></script><script>
'use strict';
const checks=[], events=[], loads=[], originalFetch=window.fetch;
const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const basic=index=>({index,title:'庭中长篇 '+index,source:'https://example.com/original',access:'public',reviewedAt:'2026-10-09',coverage:'summary',summary:'这是有明确来源的收录摘要。',coverageNotes:['仅测试固定资料，不代表全站全文。'],sections:[
 {id:'intro',title:'序言与开场',paragraphs:['这是可以在庭中阅读的中文正文。书页展开，眼前不再只有一道通往别处的入口。我们慢慢走过庭院，让每一段文字拥有停留的地方。'.repeat(6),'第二段描述庭院与书页。']},
 {id:'chapter-two',title:'第二篇 · 文字与表格',paragraphs:['全文查找 needle 跨篇章找到这段。','<img src=x onerror=alert(1)> 这只是纯文本。'],tables:[{caption:'原文比较表',columns:['项目','说明'],rows:[['章法','needle 出现在表格里'],['脚本示例','<svg onload=alert(1)>']]}]}
]});
const fixtures={0:basic(0),1:basic(1),2:{...basic(2),title:'<img src=x onerror=alert(1)>',source:'javascript:alert(1)',coverage:undefined,sections:[{id:'unsafe',title:'<script>alert(1)<\/script>',source:'https://user:pass@example.com/',paragraphs:['<iframe src="https://example.com">不会成为 HTML</iframe>']}]},3:basic(99),4:{...basic(4),coverage:'entrance-only',access:'login-required',summary:'这里只能确认登录入口。',sections:[]},5:{...basic(5),sections:[]},8:{...basic(8),sections:[{id:'same',paragraphs:['a']},{id:'same',paragraphs:['b']}]}};
window.fetch=async function(url,options){
 if(!String(url).includes('/reading-room-qa/mock/'))return originalFetch(url,options);
 loads.push(String(url));
 const key=String(url).split('/').pop();
 if(key==='index.json')return new Response(JSON.stringify({entries:Array.from({length:9},(_,index)=>({index,path:index===7?'https://example.com/data.json':index+'.json'}))}),{headers:{'content-type':'application/json'}});
 if(key==='0.json')await pause(160);
 if(options.signal.aborted)throw new DOMException('Aborted','AbortError');
 const fixture=fixtures[Number(key.split('.')[0])];
 return new Response(JSON.stringify(fixture||{}),{status:fixture?200:404,headers:{'content-type':'application/json'}});
};
let moves=0;window.addEventListener('keydown',()=>moves++);
window.reader=CourtyardReading.install({manifestUrl:'mock/index.json',entries:Array.from({length:9},(_,i)=>({title:'入口 '+i,url:i===2?'javascript:alert(1)':'https://example.com/'+i})),onOpen:i=>events.push(['open',i]),onClose:i=>events.push(['close',i]),onSection:(i,s)=>events.push(['section',i,s&&s.id]),onVisit:i=>events.push(['visit',i])});
const $=selector=>document.querySelector(selector);
function assert(value,message){if(!value)throw Error(message);checks.push('PASS '+message);$('#results').textContent=checks.join('\n');}
$('#opener').onclick=()=>reader.open(1);
$('#run').onclick=async function(){
 this.disabled=true;checks.length=0;$('#status').textContent='检查中…';
 try{
  assert(loads.length===0,'安装时不预加载正文');$('#opener').focus();
  const first=reader.open(0);await pause(20);await reader.open(1);assert(await first===false,'较旧加载不能覆盖新建筑');
  assert($('#cr-title').textContent==='庭中长篇 1','正确建筑正文载入');
  assert(events.filter(e=>e[0]==='visit').length===1,'仅完成加载的建筑记为已读');
  assert($('.cr-coverage-badge').textContent==='内容摘要','明确标注摘要而非全文');
  const input=$('#cr-search');input.value='needle';input.dispatchEvent(new Event('input',{bubbles:true}));
  assert(document.querySelectorAll('.cr-result').length===2,'全文搜索正文和表格');
  document.querySelectorAll('.cr-result')[1].click();assert($('.cr-section-title').textContent==='第二篇 · 文字与表格','搜索结果定位到篇章');
  assert(document.querySelectorAll('.cr-table th[scope="col"]').length===2,'表格具有语义列标题');
  assert(!$('.cr-article img,.cr-article svg,.cr-article iframe,.cr-article script'),'正文不执行 HTML');
  input.dispatchEvent(new KeyboardEvent('keydown',{key:'w',bubbles:true}));assert(moves===0,'阅读按键不会进入世界移动处理');
  input.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true,cancelable:true}));await pause(30);
  assert(!reader.isOpen&&document.activeElement.id==='opener','Esc关闭并归还焦点');
  const pending=reader.open(0);reader.close();assert(await pending===false&&!reader.isOpen,'加载中关闭不会自动重开');await pause(30);
  await reader.open(1);reader.close();await reader.open(1);await pause(50);history.back();await pause(80);
  assert(!reader.isOpen,'快速重开后浏览器返回仍关闭阅览');
  history.forward();await pause(80);assert(reader.isOpen&&reader.currentIndex===1,'浏览器前进恢复上次阅览');
  assert(loads.filter(url=>url.endsWith('/1.json')).length===1,'重复打开使用已验证的缓存');
  await reader.open(2);assert(!$('.cr-metadata a,.cr-section-source'),'拒绝脚本和含密码的来源链接');
  assert($('.cr-coverage-badge').textContent==='收录范围待核实','不根据有文字推断完整收录');
  assert(!$('#cr-title img,.cr-article iframe,.cr-article script'),'标题与正文保持纯文字');
  assert(await reader.open(3)===false&&!!$('.cr-retry'),'编号错误展示可重试状态');
  assert(await reader.open(6)===false&&!!$('.cr-error-source a'),'404展示诚实状态和可选来源');
  assert(await reader.open(7)===false&&$('.cr-error-copy').textContent.includes('静态'),'跨域文本地址在请求前被拒绝');
  assert(await reader.open(8)===false,'重复篇章编号被拒绝');
  await reader.open(4);assert($('.cr-coverage-badge').textContent==='入口说明'&&$('.cr-article').textContent.includes('需登录'),'登录入口明确说明范围');
  await reader.open(5);assert($('.cr-empty').textContent.includes('没有可阅读'),'空正文保留诚实提示');
  assert(await reader.open(-1)===false&&await reader.open('1')===false&&await reader.open(30)===false,'拒绝无效建筑编号');
  reader.close();await pause(40);$('#status').textContent=checks.length+' 项通过';
 }catch(error){reader.close();checks.push('FAIL '+error.message);$('#results').textContent=checks.join('\n');$('#status').textContent='检查失败';console.error(error);}
 if(['localhost','127.0.0.1'].includes(location.hostname))await fetch('/__qa_artifact',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'reading-fixture-report.json',text:JSON.stringify({checks,passed:!checks.some(c=>c.startsWith('FAIL'))},null,2)})});
 this.disabled=false;
};
if(location.search.includes('run'))$('#run').click();
</script></html>
