<!doctype html><meta charset="utf-8"><title>本地展陈动作检查</title><style>body{font:16px/1.7 system-ui;background:#eee9df;color:#243b30;margin:24px}img{max-width:100%;width:500px}pre{white-space:pre-wrap}</style><h1>本地展陈动作检查</h1><p>浏览器中的真实 Canvas 绘制及动作逻辑测试，没有三维渲染，不证明建筑中的可见性或遮挡。</p><button id="run">运行 78 个动作</button><pre id="result">等待运行</pre><div id="samples"></div>
<script src="../vendor/three.min.js"></script><script src="../assets/architecture.js"></script><script src="../assets/content-core.js"></script><script src="../assets/content-creation-care.js"></script><script src="../assets/content-services.js"></script><script src="../assets/twinstars-detail.js"></script><script src="../assets/content-narratives.js"></script><script src="../assets/rubbing-detail.js"></script><script src="../assets/content-literary.js"></script><script src="../assets/moon-snow-garden.js"></script><script src="../assets/reading-catalog.js"></script><script src="../assets/reading-panels.js"></script><script src="../assets/building-actions.js"></script><script>
document.getElementById('run').onclick=()=>{const rows=[],records=[],root=document.getElementById('samples');root.replaceChildren();try{for(let index=0;index<26;index++){const b=index===23?{root:new THREE.Group(),mechanisms:[],metadata:{}}:CourtyardArchitecture.build({THREE,index,title:CourtyardReadingCatalog[index].title,zone:0});b.index=index;records.push(b);if(index!==23)CourtyardReadingPanels.attach({THREE,building:b,index,entry:{title:CourtyardReadingCatalog[index].title},preview:CourtyardReadingCatalog[index]});}const api=CourtyardBuildingActions.create({THREE,records,catalog:CourtyardReadingCatalog,onButterflyPhase(){},onSection(i,id){const p=records[i].readingPanels;if(!p)return i===20||i===23;p.setSection(id);return true;}});for(let index=0;index<26;index++)for(let phase=0;phase<3;phase++){const result=api.apply(index,phase);api.update(.1);if(!result.ok||!result.effectAvailable)throw Error('Missing action '+index+':'+phase);rows.push({index,phase,kind:result.kind,effectAvailable:result.effectAvailable});if([0,6,24,25].includes(index)){const name=api.inspect(index).ownedObjects.find(n=>n.startsWith('local-exhibit-paper')),obj=name&&records[index].root.getObjectByName(name);if(obj?.material?.map?.image){const img=new Image();img.alt='建筑 '+index+' · 动作 '+phase+' · 二维展陈纹理';img.src=obj.material.map.image.toDataURL();root.append(img);}}}document.getElementById('result').textContent=JSON.stringify({passed:true,checks:rows.length,kind:'Browser Canvas only; no WebGL pixels',rows},null,2);api.dispose();}catch(error){document.getElementById('result').textContent=JSON.stringify({passed:false,error:String(error.stack||error),rows},null,2)}};
</script>
