const scene=new THREE.Scene();scene.background=new THREE.Color(0xcdd5d3);const r=new THREE.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);r.outputEncoding=THREE.sRGBEncoding;r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1;document.body.append(r.domElement);const camera=new THREE.PerspectiveCamera(43,innerWidth/innerHeight,.1,1000);camera.position.set(43,33,59);camera.lookAt(0,3,0);scene.add(new THREE.HemisphereLight(0xe2f5ff,0x7b705c,1.3));const sun=new THREE.DirectionalLight(0xffe4bd,2);sun.position.set(-30,50,20);scene.add(sun);const ground=new THREE.Mesh(new THREE.PlaneGeometry(160,100),new THREE.MeshStandardMaterial({color:0xb0b4a0,roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-.08;scene.add(ground);for(let i=0;i<3;i++){const b=CourtyardInfrastructure.buildMath({THREE,index:i});b.root.position.x=(i-1)*24;scene.add(b.root);}const t=CourtyardInfrastructure.buildTorii({THREE});t.root.position.set(0,0,22);scene.add(t.root);function draw(){r.render(scene,camera)}draw();onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();r.setSize(innerWidth,innerHeight);draw()};document.getElementById('save').onclick=async()=>{draw();await fetch('/__qa_artifact',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'infrastructure-preview.png',base64:r.domElement.toDataURL().split(',')[1]})});document.getElementById('save').textContent='Saved'};
