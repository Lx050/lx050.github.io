<title>Lx050</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
    background: #0a0a0a;
    color: #e8e8e8;
    line-height: 1.5;
    overflow-x: hidden;
  }
  /* Hero */
  .hero {
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
  }
  .hero h1 {
    font-size: clamp(4rem, 15vw, 12rem);
    font-weight: 800;
    letter-spacing: -0.05em;
    background: linear-gradient(135deg, #fff 0%, #666 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: fadeUp 1s ease-out;
  }
  .hero p {
    font-size: 1.2em;
    color: #666;
    margin-top: 20px;
    animation: fadeUp 1s ease-out 0.3s backwards;
  }
  .scroll-hint {
    position: absolute;
    bottom: 40px;
    color: #444;
    font-size: 0.9em;
    animation: bounce 2s infinite;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(10px); }
  }
  /* Sections */
  .section {
    max-width: 900px;
    margin: 0 auto;
    padding: 100px 24px;
  }
  .section h2 {
    font-size: 0.7em;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: #444;
    margin-bottom: 40px;
  }
  /* Links grid */
  .links {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 1px;
    background: #1a1a1a;
  }
  .links a {
    display: block;
    padding: 30px;
    background: #0a0a0a;
    color: #e8e8e8;
    text-decoration: none;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .links a:hover {
    background: #141414;
    padding-left: 36px;
  }
  .links a::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 3px;
    background: linear-gradient(180deg, #6366f1, #a855f7);
    transform: scaleY(0);
    transition: transform 0.2s;
  }
  .links a:hover::before { transform: scaleY(1); }
  .links a .name {
    font-size: 1.1em;
    font-weight: 500;
    display: block;
  }
  .links a .desc {
    font-size: 0.85em;
    color: #555;
    margin-top: 4px;
    display: block;
  }
  /* Footer */
  footer {
    text-align: center;
    padding: 60px 24px;
    color: #333;
    font-size: 0.9em;
  }
  /* Reveal on scroll */
  .reveal {
    opacity: 0;
    transform: translateY(30px);
    transition: opacity 0.6s, transform 0.6s;
  }
  .reveal.visible {
    opacity: 1;
    transform: translateY(0);
  }
  @media (max-width: 600px) {
    .links { grid-template-columns: 1fr; }
  }
</style>
</head>

<script>
  // Scroll reveal
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) e.target.classList.add('visible');
    });
  }, { threshold: 0.1 });
  document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
</script>
